
name: Deploy Bryan Vanessa to Provite

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LFTP
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp index.html invitation.html private.html deploy/
          cp -r css js assets deploy/

      - name: Upload via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" \
            -p "$SFTP_PORT" \
            "sftp://$SFTP_HOST" <<'EOF'
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm yes
          mirror -R --verbose deploy/ /events/bryanvanessa/
          bye
          EOF
