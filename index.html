<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Wedding Bryan & Vanessa</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* ================= LAYOUT UTAMA ================= */

      .desktop-layout {
        display: flex;
        width: 100%;
        height: 100dvh;
      }

      /* ================= DESKTOP LEFT ================= */

      .desktop-photo {
        display: none;
      }

      /* ================= UNDANGAN MOBILE ================= */

      .invitation-frame {
        display: block;
        flex: 1;
        width: 100%;
        min-width: 0;
        height: 100%;
        border: none;
        background: #f6f0e6;
      }

      /* ================= DESKTOP ================= */

      @media (min-width: 1024px) {
        /* AREA KIRI */
        .desktop-photo {
          position: relative;
          display: block;
          flex: 1;
          min-width: 0;
          height: 100dvh;
          overflow: hidden;
        }

        /* BACKGROUND FULL HEIGHT */
        .desktop-bg {
          position: absolute;
          inset: 0;
          z-index: 0;
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center;
        }

        /* ORNAMEN ATAS */
        .desktop-ornament-top {
          position: absolute;
          top: 0;
          left: 0;
          z-index: 10;
          display: block;
          width: 100%;
          height: auto;
          pointer-events: none;
          user-select: none;
        }

        /* ORNAMEN BAWAH */
        .desktop-ornament-bottom {
          position: absolute;
          bottom: 0;
          left: 0;
          z-index: 10;
          display: block;
          width: 100%;
          height: auto;
          pointer-events: none;
          user-select: none;
        }

        /* AREA KANAN: UNDANGAN 390PX */
        .invitation-frame {
          flex: 0 0 390px;
          width: 390px;
          height: 100dvh;
        }
      }
    </style>
  </head>

  <body>
    <main class="desktop-layout">
      <!--================ DESKTOP LEFT =================-->
      <aside class="desktop-photo" aria-hidden="true">
        <!-- BACKGROUND UTAMA -->
        <img
          src="assets/images/desktop/langit.webp"
          alt=""
          class="desktop-bg"
        />

        <!-- ORNAMEN ATAS -->
        <img
          src="assets/images/desktop/ornamentatas.webp"
          alt=""
          class="desktop-ornament-top"
        />

        <!-- ORNAMEN BAWAH -->
        <img
          src="assets/images/desktop/ornamentbawah.webp"
          alt=""
          class="desktop-ornament-bottom"
        />
      </aside>
      <!--================ END DESKTOP LEFT =================-->

      <!--================ UNDANGAN KANAN =================-->
      <iframe
        id="invitationFrame"
        class="invitation-frame"
        title="Bryan and Vanessa Wedding Invitation"
        src="invitation.html"
      ></iframe>
    </main>

    <script>
      // Teruskan parameter URL ke invitation.html
      const frame = document.getElementById("invitationFrame");

      frame.src =
        "invitation.html" + window.location.search + window.location.hash;
    </script>
  </body>
</html>
