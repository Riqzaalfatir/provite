<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Semua path relatif mengacu ke root website -->

    <base href="/" />
    <script>
      document.querySelector("base").href =
        location.hostname === "provite.id" ||
        location.hostname.endsWith(".provite.id")
          ? "/events/bryanvanessa/"
          : "/";
    </script>

    <title>The Wedding Bryan & Vanessa</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/style.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* ================= LAYOUT UTAMA ================= */

      .desktop-layout {
        display: flex;
        width: 100%;
        height: 100dvh;
      }

      /* ================= DESKTOP LEFT ================= */

      .desktop-photo {
        display: none;
      }

      /* ================= UNDANGAN MOBILE ================= */

      .invitation-frame {
        display: block;
        flex: 1;
        width: 100%;
        min-width: 0;
        height: 100%;
        border: none;
        background: #f6f0e6;
      }

      /* ================= DESKTOP ================= */

      @media (min-width: 1024px) {
        /* AREA KIRI */
        .desktop-photo {
          position: relative;
          display: block;
          flex: 1;
          min-width: 0;
          height: 100dvh;
          overflow: hidden;
        }

        /* BACKGROUND FULL HEIGHT */
        .desktop-bg {
          position: absolute;
          inset: 0;
          z-index: 0;
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center;
        }

        /* ORNAMEN ATAS */
        .desktop-ornament-top {
          position: absolute;
          top: 0;
          left: 0;
          z-index: 10;
          display: block;
          width: 100%;
          height: auto;
          pointer-events: none;
          user-select: none;
        }

        /* ORNAMEN BAWAH */
        .desktop-ornament-bottom {
          position: absolute;
          bottom: 0;
          left: 0;
          z-index: 10;
          display: block;
          width: 100%;
          height: auto;
          pointer-events: none;
          user-select: none;
        }

        /* AREA KANAN: UNDANGAN 390PX */
        .invitation-frame {
          flex: 0 0 390px;
          width: 390px;
          height: 100dvh;
        }
      }

      /* ============ FULLSCREEN DESKTOP OVERLAY ============ */

      #desktopLoading,
      #desktopOpening {
        display: none;
      }

      /* Animasi logo Provite */
      @keyframes desktopLogoPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      @media (min-width: 1024px) {
        /* LOADING SCREEN */
        #desktopLoading {
          position: fixed;
          inset: 0;
          z-index: 999999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #f6f0e6;
          transition: opacity 450ms ease;
        }

        #desktopLoadingBar {
          width: 0%;
          height: 100%;
          background: #4b3d2a;
          transition: width 250ms ease;
        }

        .desktop-loading-logo {
          animation: desktopLogoPulse 2s ease-in-out infinite;
        }

        /* OPENING SCREEN */
        #desktopOpening {
          position: fixed;
          inset: 0;
          z-index: 999998;
          align-items: center;
          justify-content: center;
          padding: 16px;
          opacity: 1;
          transition: opacity 900ms ease;
        }

        #desktopOpening .opening-backdrop {
          position: absolute;
          inset: 0;
          background: rgba(0, 0, 0, 0.4);
          backdrop-filter: blur(5.2px);
          -webkit-backdrop-filter: blur(5.2px);
        }

        /* Card ini disalin dari invitation.html */
        #desktopOpening #openingCard {
          position: relative;
          z-index: 10;
          max-width: calc(100vw - 32px);
        }

        .desktop-ornament-background {
          position: absolute;
          top: 50%;
          left: 50%;
          z-index: 2;

          width: max(100%, 1200px);
          height: max(100%, 900px);

          object-fit: cover;
          object-position: center;

          transform: translate(-50%, -50%);

          pointer-events: none;
          user-select: none;
        }

        /* ==========================================
   DESKTOP FLOWER - RESPONSIVE GROUP
========================================== */

        @media (min-width: 1024px) {
          .desktop-flower-group {
            position: absolute;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 300px;

            z-index: 34;
            pointer-events: none;
            user-select: none;
          }

          .desktop-flower {
            position: absolute;
            bottom: 0;
            height: auto;
            max-width: none;
            pointer-events: none;
            user-select: none;
          }

          /* BUNGA KIRI */
          .flower-1 {
            left: 0%;
            width: 18%;
            z-index: 4;
          }

          /* BUNGA SAMPING KIRI 1 */
          .flower-2 {
            left: 1%;
            width: 41%;
            z-index: 3;
          }

          /* BUNGA SAMPING KIRI 2 */
          .flower-3 {
            left: 9%;
            width: 50%;
            z-index: 3;
          }

          /* BUNGA SAMPING KIRI 3 */
          .flower-4 {
            left: 30%;
            width: 35%;
            z-index: 2;
          }

          /* BUNGA SAMPING KIRI 4 */
          .flower-5 {
            left: 45%;
            width: 37%;
            z-index: 2;
          }

          /* BUNGA KANAN */
          .flower-6 {
            right: 0;
            width: 27%;
            z-index: 3;
          }

          /* BUNGA SAMPING KIRI TAMBAHAN */
          .flower-7 {
            left: 65%;
            width: 40%;
            z-index: 3;
          }
        }

        /* ==========================================
   ORNAMEN ATAS DESKTOP
   Posisi bisa disesuaikan masing-masing
========================================== */

        @media (min-width: 1024px) {
          .desktop-top-ornament {
            position: absolute;
            height: auto;
            max-width: none;
            pointer-events: none;
            user-select: none;
          }

          /* OBJECT 13 */
          .top-ornament-1 {
            top: 0;
            left: 6%;
            width: 75%;
            z-index: 3;
          }

          /* OBJECT 14 */
          .top-ornament-2 {
            top: 0;
            left: 5%;
            width: 22%;
            z-index: 1;
          }

          /* OBJECT 15 */
          .top-ornament-3 {
            top: 0;
            right: 5%;
            width: 50%;
            z-index: 1;
          }
        }

        /* ==========================================
   DESKTOP PILLAR - RESPONSIVE
========================================== */

        @media (min-width: 1024px) {
          .desktop-pillar {
            position: absolute;
            bottom: 0;

            width: 11%;
            height: auto;

            z-index: 10;
            pointer-events: none;
            user-select: none;
          }

          /* PILAR KIRI */
          .desktop-pillar-left {
            left: 0;
          }

          /* PILAR KANAN */
          .desktop-pillar-right {
            right: 0;
          }
        }
      }
    </style>

    <style>
      /* Khusus undangan yang berada di iframe desktop */
      html.desktop-iframe #openingScreen {
        visibility: hidden !important;
      }
    </style>
  </head>

  <body>
    <main class="desktop-layout">
      <!--================ DESKTOP LEFT =================-->

      <aside class="desktop-photo relative overflow-hidden" aria-hidden="true">
        <!-- LAYER 1: BACKGROUND LANGIT -->
        <img
          src="assets/images/desktop/langit.webp"
          alt=""
          class="desktop-bg"
        />

        <!-- LAYER 2: ORNAMEN BACKGROUND -->
        <img
          src="assets/images/desktop/ornamentbackground.webp"
          alt=""
          class="desktop-ornament-background"
        />

        <!-- LAYER 3: TEKS TENGAH -->
        <div
          class="flex flex-col items-center justify-center leading-none absolute left-1/2 top-1/2 z-[5] w-full -translate-x-1/2 -translate-y-1/2 whitespace-nowrap text-center"
        >
          <p
            class="uppercase font-cinzel font-medium text-[24px] text-[#474541]"
          >
            THE WEDDING OF
          </p>
          <h1
            class="mt-[13px] font-cinzel text-[64px] font-medium leading-[1.2] text-[#474541]"
          >
            BRYAN &amp; VANESSA
          </h1>
        </div>

        <!-- PILAR KIRI BAWAH -->
        <img
          src="assets/images/desktop/pilarkiri.webp"
          alt=""
          aria-hidden="true"
          class="desktop-pillar desktop-pillar-left"
        />

        <!-- PILAR KANAN BAWAH -->
        <img
          src="assets/images/desktop/pilarkanan.webp"
          alt=""
          aria-hidden="true"
          class="desktop-pillar desktop-pillar-right"
        />

        <!-- ==========================================
     KELOMPOK ORNAMEN BUNGA DESKTOP
========================================== -->
        <div class="desktop-flower-group">
          <img
            src="assets/images/desktop/bungakiri.webp"
            alt=""
            class="desktop-flower flower-1 animate-desktop-flower-left"
          />

          <img
            src="assets/images/desktop/bungasampingkiri1.webp"
            alt=""
            class="desktop-flower flower-2 animate-desktop-flower-slow"
          />

          <img
            src="assets/images/desktop/bungasampingkiri1.webp"
            alt=""
            class="desktop-flower flower-7 animate-desktop-flower-reverse"
          />

          <img
            src="assets/images/desktop/bungasampingkiri2.webp"
            alt=""
            class="desktop-flower flower-3 animate-desktop-flower-slow"
          />

          <img
            src="assets/images/desktop/bungasampingkiri3.webp"
            alt=""
            class="desktop-flower flower-4 animate-desktop-flower-reverse"
          />

          <img
            src="assets/images/desktop/bungasampingkiri4.webp"
            alt=""
            class="desktop-flower flower-5 animate-desktop-flower-slow"
          />

          <img
            src="assets/images/desktop/bungakanan.webp"
            alt=""
            class="desktop-flower flower-6 animate-desktop-flower-right"
          />
        </div>

        <!-- ==========================================
     ORNAMEN ATAS DESKTOP
========================================== -->

        <!-- ORNAMEN ATAS 1 -->
        <img
          src="assets/images/desktop/Object (13).webp"
          alt=""
          aria-hidden="true"
          class="desktop-top-ornament top-ornament-1 animate-desktop-top-left"
        />

        <!-- ORNAMEN ATAS 2 -->
        <img
          src="assets/images/desktop/Object (14).webp"
          alt=""
          aria-hidden="true"
          class="desktop-top-ornament top-ornament-2 animate-desktop-top-middle"
        />

        <!-- ORNAMEN ATAS 3 -->
        <img
          src="assets/images/desktop/Object (15).webp"
          alt=""
          aria-hidden="true"
          class="desktop-top-ornament top-ornament-3 animate-desktop-top-right"
        />

        <!-- POHON SAMPING FULL -->
        <img
          src="assets/images/desktop/pohon-samping-full.webp"
          alt=""
          aria-hidden="true"
          class="desktop-side-tree pointer-events-none absolute -top-[4vw] left-0 z-[4] h-auto w-full select-none"
        />

          <img
          src="assets/gift/kupuungu.gif"
          alt=""
          aria-hidden="true"
          class="absolute bottom-[12.5vw] left-[2vw] z-40 h-auto w-[129px] max-w-none select-none pointer-events-none"
        />

        <img
          src="assets/gift/kupuemas.gif"
          alt=""
          aria-hidden="true"
          class="absolute bottom-[9vw] right-[6vw] z-40 h-auto w-[94px] max-w-none -scale-x-100 select-none pointer-events-none"
        />
      </aside>

      <!--================ END DESKTOP LEFT =================-->

      <!--================ UNDANGAN KANAN =================-->
      <iframe
        id="invitationFrame"
        class="invitation-frame"
        title="Bryan and Vanessa Wedding Invitation"
      ></iframe>
    </main>

    <!-- =============== DESKTOP LOADING SCREEN =============== -->
    <div id="desktopLoading">
      <div class="w-[300px] max-w-[85vw] text-center">
        <!-- LOGO PROVITE -->
        <img
          src="assets/images/loadingscreen/provite.webp"
          alt="Provite"
          class="desktop-loading-logo mx-auto mb-[20px] h-auto w-[127px] object-contain"
        />

        <!-- PROGRESS BAR -->
        <div class="h-[5px] w-full overflow-hidden rounded-full bg-gray-200">
          <div id="desktopLoadingBar"></div>
        </div>

        <!-- PERSENTASE -->
        <p
          id="desktopLoadingPercent"
          class="mt-[10px] font-cinzel text-[12px] text-[#4B3D2A]"
        >
          0%
        </p>
      </div>
    </div>
    <!-- =============== END DESKTOP LOADING =============== -->

    <!-- =============== DESKTOP OPENING SCREEN =============== -->
    <div id="desktopOpening">
      <!-- BACKDROP FULLSCREEN -->
      <div class="opening-backdrop"></div>

      <div id="desktopOpeningContent"></div>
    </div>
    <!-- =============== END DESKTOP OPENING =============== -->

    <script>
      const frame = document.getElementById("invitationFrame");

      const desktopLoading = document.getElementById("desktopLoading");
      const desktopOpening = document.getElementById("desktopOpening");

      const desktopBar = document.getElementById("desktopLoadingBar");
      const desktopPercent = document.getElementById("desktopLoadingPercent");

      const openingContent = document.getElementById("desktopOpeningContent");

      const isDesktop = () => window.matchMedia("(min-width: 1024px)").matches;

      // ==========================================
      // ROUTING UNDANGAN - SLUG + PIN
      // ==========================================

      const DEFAULT_SLUG = "bryanvanessa";

      const segments = window.location.pathname.split("/").filter(Boolean);

      const routeSlug = "bryanvanessa";

      const params = new URLSearchParams(window.location.search);

      const routePin =
        segments[0] === DEFAULT_SLUG && segments.length >= 2 ? segments[1] : "";

      const incomingPin = routePin || params.get("pin") || "";

      const validPin = /^\d{1,10}$/.test(incomingPin);

      if (incomingPin && !validPin) {
        const privateURL = new URL("private.html", document.baseURI);

        privateURL.searchParams.set("id", routeSlug);

        window.location.replace(privateURL.href);
      }

      // Config.js membaca "id" sebagai slug
      // dan "pin" sebagai identitas tamu.
      const iframeURL = new URL("invitation.html", document.baseURI);

      iframeURL.searchParams.set("id", routeSlug);

      for (const [key, value] of params.entries()) {
        if (key !== "id" && key !== "url" && key !== "pin") {
          iframeURL.searchParams.set(key, value);
        }
      }

      if (validPin) {
        iframeURL.searchParams.set("pin", incomingPin);
      }

      iframeURL.hash = window.location.hash;

      // ==========================================
      // SEMBUNYIKAN PIN SETELAH API BERHASIL
      // ==========================================

      function cleanInvitationURL() {
        if (!validPin) return;

        const app = frame.contentWindow?.BryanApp?.state;

        // Jangan menghilangkan PIN sebelum
        // data tamu benar-benar berhasil dimuat.
        if (
          app?.status !== "success" ||
          !app?.dataEvent?.id ||
          !app?.guest?.id
        ) {
          return;
        }

        // Simpan PIN agar refresh tetap
        // dapat menampilkan data tamu.
        try {
          localStorage.setItem(`${routeSlug}-pin`, incomingPin);
        } catch (error) {
          console.warn("Unable to save guest PIN");
        }

        // Gunakan format cookie yang sama
        // dengan js/config.js.
        const cookieName =
          "tb-pin-" + routeSlug.toLowerCase().replace(/[^a-z0-9_-]/g, "_");

        const secure = window.location.protocol === "https:" ? "; Secure" : "";

        document.cookie =
          `${cookieName}=${encodeURIComponent(incomingPin)}; ` +
          `Max-Age=${60 * 60 * 24 * 30}; ` +
          `Path=/; SameSite=Lax${secure}`;

        // URL bersih tanpa reload halaman.
        const cleanPath = "/" + encodeURIComponent(routeSlug);

        window.history.replaceState(
          window.history.state,
          "",
          cleanPath + window.location.hash,
        );

        console.log("[Bryan] Guest loaded, URL cleaned:", cleanPath);
      }

      // ===========================================
      // REDIRECT JIKA PIN INVALID
      // ===========================================

      function redirectToPrivate() {
        const privateURL = new URL("private.html", document.baseURI);

        privateURL.searchParams.set("id", "bryanvanessa");

        window.location.replace(privateURL.href);
      }

      // Terima informasi dari API melalui iframe.
      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;

        if (event.source !== frame.contentWindow) return;

        if (event.data?.type === "BRYAN_INVALID_PIN") {
          redirectToPrivate();
        }

        if (event.data?.type === "BRYAN_GUEST_LOAD_ERROR") {
          console.error(
            "[Bryan] Data tamu gagal dimuat. Undangan tidak ditampilkan.",
          );

          document.getElementById("desktopLoading")?.remove();

          document.getElementById("desktopOpening")?.remove();

          const frame = document.getElementById("invitationFrame");
          if (frame) {
            frame.style.visibility = "hidden";
          }

          alert("Data undangan belum dapat diverifikasi. Silakan coba lagi.");
        }
      });

      // Dengarkan saat data API selesai.
      frame.addEventListener("load", () => {
        const innerWindow = frame.contentWindow;

        innerWindow?.addEventListener("bryan:data-ready", cleanInvitationURL);

        // Antisipasi data sudah siap
        // sebelum listener terpasang.
        cleanInvitationURL();
      });

      // Load undangan ke iframe.
      if (frame.src !== iframeURL.href) {
        frame.src = iframeURL.href;
      }

      // ==========================================
      // PRELOAD ASET DESKTOP KIRI
      // ==========================================

      function loadDesktopImage(src) {
        return new Promise((resolve) => {
          const img = new Image();

          let done = false;

          const timer = setTimeout(() => finish(false), 20000);

          function finish(success) {
            if (done) return;
            done = true;
            clearTimeout(timer);

            if (!success) {
              console.warn("Desktop asset failed:", src);
            }

            resolve();
          }

          img.onload = () => finish(true);
          img.onerror = () => finish(false);
          img.src = src;

          if (img.complete) {
            finish(img.naturalWidth > 0);
          }
        });
      }

      const desktopAssetsReady = isDesktop()
        ? Promise.all([
            loadDesktopImage("assets/images/desktop/langit.webp"),
            loadDesktopImage("assets/images/desktop/ornamentatas.webp"),
            loadDesktopImage("assets/images/desktop/ornamentbawah.webp"),
          ])
        : Promise.resolve();

      // ==========================================
      // LOADING + OPENING DESKTOP
      // ==========================================

      frame.addEventListener("load", () => {
        if (!isDesktop()) return;

        const doc = frame.contentDocument;

        if (!doc) return;

        const interval = setInterval(async () => {
          // Baca progress dari loading.js di iframe
          const innerPercent = doc.getElementById("loadingPercent");
          const innerLoading = doc.getElementById("sectionLoading");

          if (innerPercent) {
            const progress = parseInt(innerPercent.textContent, 10) || 0;

            desktopBar.style.width = `${Math.min(progress, 99)}%`;
            desktopPercent.textContent = `${Math.min(progress, 99)}%`;
          }

          // Tunggu sampai loading asli selesai dan dihapus
          if (innerLoading) return;

          clearInterval(interval);

          // Pastikan background & ornamen desktop kiri siap
          await desktopAssetsReady;

          const originalOpening = doc.getElementById("openingScreen");

          if (originalOpening) {
            originalOpening.style.visibility = "hidden";
          }

          // Ambil Opening Card asli dari invitation.html
          const originalCard = doc.getElementById("openingCard");

          if (!originalCard) {
            console.error("Opening Card tidak ditemukan.");
            return;
          }

          const clonedCard = originalCard.cloneNode(true);

          // Masukkan Opening Card ke tengah layar desktop
          openingContent.replaceChildren(clonedCard);

          const appState = frame.contentWindow.BryanApp?.state;

          if (appState) {
            const couple = clonedCard.querySelector("#openingCoupleName");
            const guest = clonedCard.querySelector("#openingGuestName");
            const date = clonedCard.querySelector("#openingWeddingDate");

            const event = appState.dataEvent;

            if (couple && event?.groomName && event?.brideName) {
              couple.textContent = `${event.groomName} & ${event.brideName}`;
            }

            if (guest && appState.guest?.name) {
              guest.textContent = appState.guest.name;
            }

            // Salin tanggal yang sudah diformat dari iframe
            const originalDate = doc.getElementById("openingWeddingDate");

            if (date && originalDate) {
              date.innerHTML = originalDate.innerHTML;
            }
          }

          // Tampilkan opening fullscreen
          desktopOpening.style.display = "flex";
          desktopOpening.style.opacity = "1";

          // Selesaikan progress desktop
          desktopBar.style.width = "100%";
          desktopPercent.textContent = "100%";

          // Hilangkan loading desktop
          desktopLoading.style.opacity = "0";
          desktopLoading.style.pointerEvents = "none";

          setTimeout(() => {
            desktopLoading.style.display = "none";
          }, 500);

          // Tombol pada card desktop
          const desktopButton = clonedCard.querySelector("#btnOpenInvitation");

          desktopButton?.addEventListener("click", () => {
            // Jalankan tombol asli di iframe
            const originalButton = doc.getElementById("btnOpenInvitation");

            if (!originalButton || originalButton.disabled) return;

            originalButton.click();

            // Tutup opening fullscreen desktop
            desktopOpening.style.opacity = "0";
            desktopOpening.style.pointerEvents = "none";

            setTimeout(() => {
              desktopOpening.style.display = "none";
            }, 900);
          });
        }, 80);
      });

      window.addEventListener("message", function (event) {
        if (event.origin !== window.location.origin) return;

        const iframe = document.getElementById("invitationFrame");

        // Pastikan pesan berasal dari iframe undangan
        if (event.source !== iframe?.contentWindow) return;

        if (event.data?.type !== "BRYAN_GUEST_READY") return;

        const guestName = event.data.guestName;

        if (typeof guestName !== "string" || !guestName.trim()) return;

        // Perbarui nama tamu pada Opening desktop
        const desktopOpening = document.getElementById("desktopOpeningContent");

        const guestElement = desktopOpening?.querySelector("#openingGuestName");

        if (guestElement) {
          guestElement.textContent = guestName;
        }

        console.log("[Bryan Desktop] Guest updated:", guestName);
      });

      window.addEventListener("message", function (event) {
        if (event.origin !== window.location.origin) return;

        const iframe = document.getElementById("invitationFrame");

        if (event.source !== iframe?.contentWindow) return;
        if (event.data?.type !== "BRYAN_OPENING_EVENT_READY") return;

        const desktop = document.getElementById("desktopOpeningContent");
        if (!desktop) return;

        const couple = desktop.querySelector("#openingCoupleName");
        const date = desktop.querySelector("#openingWeddingDate");

        const { groomName, brideName, dateHTML } = event.data;

        if (couple && groomName && brideName) {
          couple.textContent = `${groomName} & ${brideName}`;
        }

        if (date && typeof dateHTML === "string") {
          date.innerHTML = dateHTML;
        }

        console.log("[Bryan Desktop] Opening event updated");
      });
    </script>
  </body>
</html>
